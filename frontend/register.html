<!DOCTYPE html>
<html>
<head>
  <title>BookBin - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BookBin</h1>
    <span class="links">
      <a href="login.html">Log In</a>
      <a href="register.html">Register</a>
    </span>
  </header>

  <div class="page">
    <div class="box">
      <h2>Create an Account</h2>
      <form id="registerForm">
        <label>Username</label>
        <input type="text" id="username" placeholder="Pick a username" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirm" required>

        <button type="submit">Register</button>
      </form>
      <p class="small" id="message"></p>
      <p class="small">We will email you a code to verify your account.</p>
      <p class="small">Already have an account? <a href="login.html">Log in here</a></p>
    </div>
  </div>

  <footer>BookBin - IT 340 Project</footer>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        document.getElementById("message").textContent = "Passwords do not match";
        return;
      }

      const response = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: password
        })
      });

      const data = await response.json();
      document.getElementById("message").textContent = data.message;
    });
  </script>
</body>
</html>
