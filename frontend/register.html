<!DOCTYPE html>
<html>
<head>
  <title>BookBin - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BookBin</h1>
    <span class="links">
      <a href="login.html">Log In</a>
      <a href="register.html">Register</a>
    </span>
  </header>

  <div class="page">
    <div class="box">
      <h2>Create an Account</h2>
      <form>
        <label>Username</label>
        <input type="text" placeholder="Pick a username" required>

        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" required>

        <label>Confirm Password</label>
        <input type="password" required>

        <button type="submit">Register</button>
      </form>
      <p class="small">We will email you a code to verify your account.</p>
      <p class="small">Already have an account? <a href="login.html">Log in here</a></p>
    </div>
  </div>

  <footer>BookBin - IT 340 Project</footer>
</body>
</html>
